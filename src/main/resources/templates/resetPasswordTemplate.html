<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="max-w-md w-full bg-white p-6 rounded-lg shadow-lg">
    <div class="text-center mb-4">
        <h2 class="text-2xl font-semibold text-gray-800">Password Reset Request</h2>
        <p class="text-gray-600">We received a request to reset your password. Click the button below to reset your password.</p>
    </div>

    <!-- Reset Link Section -->
    <div class="text-center mt-6">
        <a href="{{resetLink}}" class="inline-block px-6 py-3 bg-blue-500 text-white rounded-lg text-lg font-semibold hover:bg-blue-600 transition duration-300">
            Reset Your Password
        </a>
    </div>

    <div class="mt-6 text-center">
        <p class="text-sm text-gray-500">If you didn't request this, you can safely ignore this email.</p>
    </div>

    <div class="mt-4 text-center">
        <p class="text-sm text-gray-500">If you have any issues, feel free to contact us.</p>
    </div>
</div>

</body>
</html>
