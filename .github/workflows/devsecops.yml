name: Spring Boot DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_HUB_USER: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: spring-app
  IMAGE_TAG: latest

jobs:
  build-security:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Cache Maven dependencies (FIX 429 ERROR)
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Pre-download dependencies (avoid Maven Central spam)
      - name: Resolve dependencies
        run: mvn dependency:go-offline

      # 5. Build Spring Boot app
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 6. Trivy FS scan (code + dependencies)
      - name: Trivy File System Scan
        run: |
          docker run --rm -v $(pwd):/src aquasec/trivy fs /src

      # 7. Build Docker image
      - name: Build Docker Image
        run: docker build -t $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG .

      # 8. Login to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 9. Push Docker image
      - name: Push to Docker Hub
        run: docker push $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG

      # 10. Trivy Image scan
      - name: Trivy Image Scan
        run: |
          docker run --rm aquasec/trivy image $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG
