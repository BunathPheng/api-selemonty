name: Spring Boot DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_HUB_USER: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: spring-app
  IMAGE_TAG: latest

jobs:
  build-security:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21 (no built-in cache — managed manually below)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Cache Maven local repository
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Cache Trivy vulnerability database
      #    - Trivy DB lives in ~/.cache/trivy by default on the host.
      #    - We cache it so --skip-db-update works on every run AFTER the first.
      #    - Key includes the date so the DB refreshes once per day automatically.
      - name: Cache Trivy DB
        uses: actions/cache@v4
        id: trivy-db-cache
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # 5. Get today's date for the Trivy DB cache key
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 6. Download Trivy DB if cache missed (first run or daily refresh)
      #    We run trivy image --download-db-only once to populate ~/.cache/trivy,
      #    then every subsequent step reuses it via --skip-db-update.
      - name: Download Trivy DB (if not cached)
        if: steps.trivy-db-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy image \
              --download-db-only \
              --no-progress

      # 7. Resolve ALL Maven dependencies into local cache
      - name: Resolve dependencies (populate local cache)
        run: |
          mvn -B dependency:go-offline --no-transfer-progress
          mvn -B dependency:resolve-plugins --no-transfer-progress

      # 8. Build Spring Boot application
      - name: Build with Maven
        run: mvn -B clean package -DskipTests --no-transfer-progress

      # 9. Trivy filesystem scan — uses cached DB + cached Maven repo
      - name: Trivy File System Scan
        run: |
          docker run --rm \
            -v $(pwd):/src \
            -v ~/.m2:/root/.m2 \
            -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy fs \
              --skip-db-update \
              --no-progress \
              /src

      # 10. Build Docker image
      - name: Build Docker Image
        run: docker build -t $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG .

      # 11. Login to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 12. Push image to Docker Hub
      - name: Push Docker Image
        run: docker push $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG

      # 13. Trivy image scan — reuses same cached DB
      - name: Trivy Image Scan
        run: |
          docker run --rm \
            -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy image \
              --skip-db-update \
              --no-progress \
              $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG
