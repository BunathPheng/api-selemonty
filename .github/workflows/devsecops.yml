name: Spring Boot DevSecOps Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKER_HUB_USER: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: spring-app
  IMAGE_TAG: latest

jobs:
  build-security:
    runs-on: ubuntu-latest

    steps:
      #-------------------------------------------------------
      # Checkout
      #-------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      #-------------------------------------------------------
      # Setup Java
      #-------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      #-------------------------------------------------------
      # Setup Node (required for Snyk CLI)
      #-------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      #-------------------------------------------------------
      # Install Snyk CLI
      #-------------------------------------------------------
      - name: Install Snyk CLI
        run: npm install -g snyk

      #-------------------------------------------------------
      # Authenticate Snyk
      #-------------------------------------------------------
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      #-------------------------------------------------------
      # Snyk Dependency Scan (Spring Boot)
      #-------------------------------------------------------
      - name: Snyk Maven Dependency Scan
        run: snyk test --all-projects --severity-threshold=high

      #-------------------------------------------------------
      # Cache Maven
      #-------------------------------------------------------
      - name: Cache Maven Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      #-------------------------------------------------------
      # Date for Trivy Cache
      #-------------------------------------------------------
      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      #-------------------------------------------------------
      # Cache Trivy DB
      #-------------------------------------------------------
      - name: Cache Trivy DB
        id: trivy-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      #-------------------------------------------------------
      # Download Trivy DB
      #-------------------------------------------------------
      - name: Download Trivy Database
        if: steps.trivy-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy:latest image \
            --download-db-only \
            --no-progress

      #-------------------------------------------------------
      # Resolve Dependencies
      #-------------------------------------------------------
      - name: Resolve Maven Dependencies
        run: |
          mvn -B dependency:go-offline --no-transfer-progress
          mvn -B dependency:resolve-plugins --no-transfer-progress

      #-------------------------------------------------------
      # Build Spring Boot App
      #-------------------------------------------------------
      - name: Build Spring Boot
        run: mvn clean package -DskipTests --no-transfer-progress

      #-------------------------------------------------------
      # Trivy FS Scan (backup security layer)
      #-------------------------------------------------------
      - name: Trivy Filesystem Scan
        run: |
          docker run --rm \
            -v $(pwd):/src \
            -v ~/.m2:/root/.m2 \
            -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy:latest fs \
            --skip-db-update \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            /src

      #-------------------------------------------------------
      # Build Docker Image
      #-------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG .

      #-------------------------------------------------------
      # Download HTML Template
      #-------------------------------------------------------
      - name: Download Trivy HTML Template
        run: |
          mkdir -p reports
          curl -L \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o reports/html.tpl

      #-------------------------------------------------------
      # Generate HTML Report (Docker Image Scan)
      #-------------------------------------------------------
      - name: Generate Trivy HTML Report
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ~/.cache/trivy:/root/.cache/trivy \
            -v $(pwd)/reports:/reports \
            aquasec/trivy:latest image \
            --skip-db-update \
            --format template \
            --template "@/reports/html.tpl" \
            -o /reports/trivy-report.html \
            $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG

      #-------------------------------------------------------
      # Upload HTML Report
      #-------------------------------------------------------
      - name: Upload Trivy HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-html-report
          path: reports/trivy-report.html

      #-------------------------------------------------------
      # Trivy Security Gate (BLOCK PUSH IF VA EXISTS)
      #-------------------------------------------------------
      - name: Trivy Security Gate
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy:latest image \
            --skip-db-update \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG

      #-------------------------------------------------------
      # Login Docker Hub
      #-------------------------------------------------------
      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

      #-------------------------------------------------------
      # Push Image (ONLY if SNYK + TRIVY passed)
      #-------------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG
