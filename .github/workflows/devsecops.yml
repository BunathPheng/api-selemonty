name: Spring Boot DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_HUB_USER: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: spring-app
  IMAGE_TAG: latest

jobs:
  build-security:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Cache Maven (must be first)
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      # 4. Preload dependencies (avoid runtime downloads)
      - name: Warm dependencies
        run: mvn -B dependency:go-offline

      # 5. Build OFFLINE (KEY FIX)
      - name: Build project offline
        run: mvn -B -o clean package -DskipTests

      # 6. Trivy scan (NO Maven involved)
      - name: Trivy FS Scan
        run: docker run --rm -v $(pwd):/src aquasec/trivy fs /src

      # 7. Docker build
      - name: Build image
        run: docker build -t $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG .

      # 8. Docker login
      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 9. Push image
      - name: Push image
        run: docker push $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG

      # 10. Image scan
      - name: Trivy image scan
        run: docker run --rm aquasec/trivy image $DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG
