name: Spring Boot DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 2. Build Spring Boot app
      - name: Build with Maven
        run: mvn clean package

      # 3. SAST (Code Security)
      - name: Run SonarQube Scan
        run: echo "Run SonarQube analysis here"

      # 4. Dependency Scan (SCA)
      - name: OWASP Dependency Check
        run: |
          docker run --rm -v $(pwd):/src owasp/dependency-check \
          --scan /src --format ALL

      # 5. Build Docker image
      - name: Build Docker Image
        run: docker build -t spring-app .

      # 6. Container Scan (Trivy)
      - name: Scan Docker Image
        run: |
          docker run --rm aquasec/trivy image spring-app

      # 7. Push image (optional)
      - name: Login to Registry
        run: echo "docker login harbor"

      - name: Push image
        run: echo "docker push harbor/spring-app"
